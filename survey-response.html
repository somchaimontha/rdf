<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-t="surveyMyTitle">แบบสอบถามของฉัน</title>
<link rel="stylesheet" href="assets/css/rdf.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  .response-hero{background:linear-gradient(135deg,#064e3b,#059669);color:#fff;border-radius:18px;padding:22px;margin-bottom:18px}
  .assignment-list{display:grid;gap:10px}.assignment-card{background:#fff;border:1px solid #dbe3e8;border-radius:13px;padding:14px;display:flex;align-items:flex-start;gap:12px;box-shadow:0 3px 12px rgba(15,23,42,.04)}.assignment-icon{width:38px;height:38px;border-radius:11px;background:#ecfdf5;color:#047857;display:flex;align-items:center;justify-content:center;flex:0 0 auto}.assignment-copy{flex:1;min-width:0}.assignment-copy h3{font-size:14px;font-weight:700;color:#1e293b}.assignment-copy p{font-size:10px;color:#64748b;margin-top:4px}.response-status{display:inline-flex;border-radius:999px;padding:2px 8px;font-size:9px;font-weight:700;background:#fef3c7;color:#92400e;margin-top:7px}.response-status.done{background:#dcfce7;color:#166534}.response-status.expired{background:#fee2e2;color:#991b1b}
  .response-paper{background:#fff;border:1px solid #dbe3e8;border-radius:15px;overflow:hidden;box-shadow:0 5px 20px rgba(15,23,42,.06)}.response-head{padding:18px;background:#f0fdf4;border-bottom:1px solid #d1fae5}.response-head h2{font-size:18px;font-weight:800;color:#065f46}.response-head p{font-size:11px;color:#475569;margin-top:5px}.response-body{padding:18px;display:grid;gap:14px}.response-question{border:1px solid #e2e8f0;border-radius:12px;padding:13px}.response-question legend,.response-question>label:first-child{display:block;font-size:12px;font-weight:700;color:#1e293b;margin-bottom:8px}.required-mark{color:#dc2626;font-size:10px;margin-left:4px}.response-input{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:9px 10px;font-size:12px}.choice-list{display:grid;gap:7px}.choice-label{display:flex;align-items:flex-start;gap:7px;font-size:11px;color:#334155;cursor:pointer}.rating-row{display:flex;gap:7px;flex-wrap:wrap}.rating-option input{position:absolute;opacity:0}.rating-option span{width:35px;height:35px;border:1px solid #cbd5e1;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#475569;cursor:pointer}.rating-option input:checked+span{background:#047857;color:#fff;border-color:#047857}.matrix-wrap{overflow-x:auto}.matrix-table{width:100%;border-collapse:collapse;font-size:10px;min-width:520px}.matrix-table th,.matrix-table td{border:1px solid #e2e8f0;padding:7px;text-align:center}.matrix-table th:first-child,.matrix-table td:first-child{text-align:left;min-width:150px}.matrix-table th{background:#f8fafc;color:#475569}.response-footer{position:sticky;bottom:0;background:#fff;border-top:1px solid #e2e8f0;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.response-progress{font-size:10px;color:#64748b}
  .response-empty{text-align:center;background:#fff;border:1px dashed #cbd5e1;border-radius:14px;padding:45px 20px;color:#94a3b8}.hidden{display:none!important}
  @media(max-width:640px){.assignment-card{flex-wrap:wrap}.assignment-card .btn{width:100%;justify-content:center}.response-body{padding:11px}.response-question{padding:11px}.response-footer .btn{flex:1}.matrix-wrap{overflow:visible}.matrix-table,.matrix-table tbody,.matrix-table tr,.matrix-table td{display:block;min-width:0}.matrix-table thead{display:none}.matrix-table tr{border:1px solid #e2e8f0;border-radius:10px;padding:9px;margin-bottom:9px}.matrix-table td{border:0;padding:4px;text-align:left!important}.matrix-table td:first-child{font-weight:700;margin-bottom:5px}.matrix-table td label{display:flex;align-items:center;gap:7px}.matrix-table td label span{display:inline!important}}
</style>
</head>
<body class="bg-slate-50 min-h-screen">
<div id="loader" class="hidden"><div class="loader-spinner"></div><p id="loaderText"><span data-t="stLoading">กำลังโหลด...</span></p></div>
<nav class="rdf-nav"><div class="nav-inner"><a href="dashboard.html" class="nav-brand"><div class="nav-title hide-mobile"><h1 data-t="foundationShort">มูลนิธิฯ Dr. Robert Dyckerhoff</h1><p data-t="appName">ระบบจัดการข้อมูลทุนการศึกษา</p></div><img src="https://raw.githubusercontent.com/somchaimontha/rdf/refs/heads/main/RDF%20original%20s%20(2).png" alt="RDF" class="nav-logo"></a><div class="nav-right"><button class="lang-btn" onclick="toggleLang()" id="langBtn">EN</button><div id="navUserWrap" class="hidden nav-user" onclick="showUserProfile()"><img id="navAvatar" src="" alt="User" class="nav-avatar"><div class="hide-mobile"><div id="navUserName" class="nav-user-name">—</div><div id="navUserRole" class="nav-user-role">—</div></div></div><button id="btnLogout" onclick="logout()" class="hidden text-white opacity-70" data-t-title="logout"><i data-lucide="log-out" class="w-5 h-5"></i></button></div></div></nav>
<main class="container main-content">
  <div class="response-hero"><a href="dashboard.html" class="inline-flex items-center gap-1 text-xs text-emerald-100 mb-2"><i data-lucide="arrow-left" class="w-3.5 h-3.5"></i><span data-t="backToDashboard">กลับหน้าหลัก</span></a><h1 class="text-xl font-bold" data-t="surveyMyTitle">แบบสอบถามของฉัน</h1><p class="text-xs text-emerald-100 mt-1" data-t="surveyMySubtitle">แบบสอบถามสำหรับการติดตามศิษย์เก่า</p></div>
  <section id="assignmentView"><div id="assignmentList" class="assignment-list"></div></section>
  <section id="responseView" class="hidden"><button class="btn btn-secondary btn-sm mb-3" onclick="showAssignmentList()"><i data-lucide="arrow-left" class="w-3.5 h-3.5"></i><span data-t="surveyBackToList">กลับรายการแบบสอบถาม</span></button><article class="response-paper"><header class="response-head"><h2 id="responseTitle">—</h2><p id="responseDescription"></p><p id="responseDue" class="font-semibold"></p></header><form id="surveyResponseForm" class="response-body" onsubmit="event.preventDefault()"></form><footer class="response-footer"><span id="responseProgress" class="response-progress"></span><div class="flex gap-2 ml-auto"><button id="saveDraftBtn" type="button" class="btn btn-secondary" onclick="saveCurrentResponse(false)"><i data-lucide="save" class="w-4 h-4"></i><span data-t="surveySaveResponseDraft">บันทึกร่าง</span></button><button id="submitResponseBtn" type="button" class="btn bg-emerald-700 text-white border-0" onclick="confirmSubmitResponse()"><i data-lucide="send" class="w-4 h-4"></i><span data-t="surveySubmit">ส่งคำตอบ</span></button></div></footer></article></section>
</main>
<footer class="rdf-footer"><span>RDF Scholarship Management System</span><span>v<span id="appVersion"></span></span></footer>
<script src="assets/js/config.js?v=2.6.32"></script><script src="assets/js/i18n.js?v=2.6.32"></script><script src="assets/js/api.js?v=2.6.32"></script><script src="assets/js/auth.js?v=2.6.32"></script><script src="assets/js/rbac.js?v=2.6.32"></script>
<script>
RBAC.enforcePage(['respondOwnSurveys']);
let ASSIGNMENTS=[],CURRENT_SURVEY=null;
function escapeSurvey(value){return String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));}
function responseText(item,thKey,enKey){return LANG==='en'?(item?.[enKey]||item?.[thKey]||''):(item?.[thKey]||item?.[enKey]||'');}
function responseStatus(item){if(item.responseStatus==='submitted')return{key:'surveyCompleted',className:'done'};if(item.campaignStatus==='closed')return{key:'surveyExpired',className:'expired'};return{key:item.responseStatus==='in_progress'?'surveyInProgress':'surveyPending',className:''};}
async function loadAssignments(){showLoader(true,t('stLoading'));try{const result=await API.getMySurveyAssignments();if(result.status!=='success')throw new Error(result.message||t('surveyAssignmentsLoadError'));ASSIGNMENTS=result.assignments||[];renderAssignments();const requested=new URLSearchParams(location.search).get('assignmentId');if(requested&&ASSIGNMENTS.some(item=>item.assignmentId===requested))await openAssignment(requested);}catch(error){Swal.fire(t('error'),error.message||t('surveyAssignmentsLoadError'),'error');}finally{showLoader(false);}}
function renderAssignments(){const holder=document.getElementById('assignmentList');holder.replaceChildren();if(!ASSIGNMENTS.length){holder.innerHTML=`<div class="response-empty"><i data-lucide="clipboard-check" class="w-10 h-10 mx-auto mb-3"></i><p>${escapeSurvey(t('surveyNoCampaigns'))}</p></div>`;lucide.createIcons();return;}ASSIGNMENTS.forEach(item=>{const status=responseStatus(item),card=document.createElement('article');card.className='assignment-card';const disabled=item.campaignStatus!=='open'&&item.responseStatus!=='submitted';card.innerHTML=`<div class="assignment-icon"><i data-lucide="clipboard-list" class="w-5 h-5"></i></div><div class="assignment-copy"><h3>${escapeSurvey(responseText(item,'titleTH','titleEN'))}</h3><p>${escapeSurvey(responseText(item,'descriptionTH','descriptionEN'))}</p><p>${escapeSurvey(t('surveyDue'))}: ${item.dueAt?escapeSurvey(formatAppDateTime(item.dueAt)):'—'}</p><span class="response-status ${status.className}">${escapeSurvey(t(status.key))}</span></div><button class="btn btn-sm ${item.responseStatus==='submitted'?'btn-secondary':'bg-emerald-700 text-white border-0'}" ${disabled?'disabled':''}>${escapeSurvey(t(item.responseStatus==='in_progress'?'surveyContinue':item.responseStatus==='submitted'?'surveyCompleted':'surveyStart'))}</button>`;card.querySelector('button').addEventListener('click',()=>openAssignment(item.assignmentId));holder.appendChild(card);});lucide.createIcons();}
async function openAssignment(assignmentId){showLoader(true,t('stLoading'));try{const result=await API.getSurveyForResponse(assignmentId);if(result.status!=='success')throw new Error(result.message||t('surveyResponseLoadError'));CURRENT_SURVEY=result;renderResponse();document.getElementById('assignmentView').classList.add('hidden');document.getElementById('responseView').classList.remove('hidden');history.replaceState({},'',`survey-response.html?assignmentId=${encodeURIComponent(assignmentId)}`);window.scrollTo({top:0});}catch(error){Swal.fire(t('error'),error.message||t('surveyResponseLoadError'),'error');}finally{showLoader(false);}}
function showAssignmentList(){CURRENT_SURVEY=null;document.getElementById('responseView').classList.add('hidden');document.getElementById('assignmentView').classList.remove('hidden');history.replaceState({},'','survey-response.html');renderAssignments();}
function questionLabel(question){return responseText(question,'promptTH','promptEN');}function optionLabel(option){return responseText(option,'labelTH','labelEN');}
function renderResponse(){const {form,assignment,response}=CURRENT_SURVEY,submitted=response?.status==='submitted'&&!form.allowEditAfterSubmit;document.getElementById('responseTitle').textContent=responseText(form,'titleTH','titleEN');document.getElementById('responseDescription').textContent=responseText(form,'descriptionTH','descriptionEN');document.getElementById('responseDue').textContent=`${t('surveyDue')}: ${assignment.dueAt?formatAppDateTime(assignment.dueAt):'—'}`;const holder=document.getElementById('surveyResponseForm');holder.replaceChildren();(form.questions||[]).forEach((question,index)=>holder.appendChild(renderQuestion(question,index,response?.answers?.[question.questionId])));document.getElementById('saveDraftBtn').classList.toggle('hidden',submitted||!form.allowDraft);document.getElementById('submitResponseBtn').classList.toggle('hidden',submitted);updateProgress();lucide.createIcons();}
function renderQuestion(question,index,value){const field=document.createElement('fieldset');field.className='response-question';field.dataset.questionId=question.questionId;field.dataset.type=question.type;const legend=document.createElement('legend');legend.innerHTML=`${index+1}. ${escapeSurvey(questionLabel(question))}${question.required?`<span class="required-mark">${escapeSurvey(t('surveyRequiredMark'))}</span>`:''}`;field.appendChild(legend);const name=`answer_${question.questionId}`;
  if(['short_text','long_text'].includes(question.type)){const input=document.createElement(question.type==='long_text'?'textarea':'input');input.className='response-input';input.name=name;input.value=value||'';if(question.type==='long_text')input.rows=4;field.appendChild(input);}
  else if(['single_choice','multiple_choice'].includes(question.type)){const list=document.createElement('div');list.className='choice-list';question.options.filter(o=>o.optionType==='choice').forEach(option=>{const label=document.createElement('label');label.className='choice-label';const input=document.createElement('input');input.type=question.type==='multiple_choice'?'checkbox':'radio';input.name=name;input.value=option.value;input.checked=question.type==='multiple_choice'?Array.isArray(value)&&value.includes(option.value):value===option.value;label.append(input,document.createTextNode(optionLabel(option)));list.appendChild(label);});field.appendChild(list);}
  else if(question.type==='dropdown'){const select=document.createElement('select');select.className='response-input';select.name=name;select.innerHTML=`<option value="">${escapeSurvey(t('surveyChoose'))}</option>`;question.options.filter(o=>o.optionType==='choice').forEach(option=>{const node=document.createElement('option');node.value=option.value;node.textContent=optionLabel(option);node.selected=value===option.value;select.appendChild(node);});field.appendChild(select);}
  else if(question.type==='yes_no'){const list=document.createElement('div');list.className='choice-list';[['yes','surveyYes'],['no','surveyNo']].forEach(([option,key])=>{const label=document.createElement('label');label.className='choice-label';label.innerHTML=`<input type="radio" name="${name}" value="${option}" ${value===option?'checked':''}> ${escapeSurvey(t(key))}`;list.appendChild(label);});field.appendChild(list);}
  else if(['rating_5','rating_10'].includes(question.type)){const row=document.createElement('div');row.className='rating-row',min=question.type==='rating_5'?1:0,max=question.type==='rating_5'?5:10;for(let score=min;score<=max;score++){const label=document.createElement('label');label.className='rating-option';label.innerHTML=`<input type="radio" name="${name}" value="${score}" ${Number(value)===score?'checked':''}><span>${score}</span>`;row.appendChild(label);}field.appendChild(row);}
  else if(question.type==='likert_matrix'){const rows=question.options.filter(o=>o.optionType==='row'),columns=question.options.filter(o=>o.optionType==='column'),wrap=document.createElement('div');wrap.className='matrix-wrap';wrap.innerHTML=`<table class="matrix-table"><thead><tr><th>${escapeSurvey(questionLabel(question))}</th>${columns.map(column=>`<th>${escapeSurvey(optionLabel(column))}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr><td>${escapeSurvey(optionLabel(row))}</td>${columns.map(column=>`<td><label><input type="radio" name="${name}_${escapeSurvey(row.value)}" data-row="${escapeSurvey(row.value)}" value="${escapeSurvey(column.value)}" ${value?.[row.value]===column.value?'checked':''}><span class="hidden">${escapeSurvey(optionLabel(column))}</span></label></td>`).join('')}</tr>`).join('')}</tbody></table>`;field.appendChild(wrap);}
  field.addEventListener('change',updateProgress);field.addEventListener('input',updateProgress);return field;}
function collectAnswers(){return [...document.querySelectorAll('.response-question')].map(field=>{const id=field.dataset.questionId,type=field.dataset.type,name=`answer_${id}`;let value='';if(['short_text','long_text','dropdown'].includes(type))value=field.querySelector(`[name="${name}"]`)?.value||'';else if(['single_choice','yes_no','rating_5','rating_10'].includes(type))value=field.querySelector(`[name="${name}"]:checked`)?.value||'';else if(type==='multiple_choice')value=[...field.querySelectorAll(`[name="${name}"]:checked`)].map(input=>input.value);else if(type==='likert_matrix'){value={};field.querySelectorAll('input:checked[data-row]').forEach(input=>value[input.dataset.row]=input.value);}return{questionId:id,value:type.startsWith('rating_')&&value!==''?Number(value):value};});}
function answerPresent(question,value){if(question.type==='multiple_choice')return Array.isArray(value)&&value.length;if(question.type==='likert_matrix'){const rows=question.options.filter(o=>o.optionType==='row');return rows.length&&rows.every(row=>value?.[row.value]);}return value!=='';}
function updateProgress(){if(!CURRENT_SURVEY)return;const answers=Object.fromEntries(collectAnswers().map(item=>[item.questionId,item.value])),questions=CURRENT_SURVEY.form.questions||[],answered=questions.filter(question=>answerPresent(question,answers[question.questionId])).length;document.getElementById('responseProgress').textContent=t('surveyProgress').replace('{answered}',answered).replace('{total}',questions.length);}
async function saveCurrentResponse(submit){const answers=collectAnswers();showLoader(true,t('saving'));try{const result=submit?await API.submitSurveyResponse(CURRENT_SURVEY.assignment.assignmentId,answers,LANG):await API.saveSurveyResponseDraft(CURRENT_SURVEY.assignment.assignmentId,answers,LANG);if(result.status!=='success')throw Object.assign(new Error(result.message||t('surveyResponseSaveError')),{questionIds:result.questionIds||[]});showLoader(false);if(submit){await Swal.fire({icon:'success',title:t('surveySubmittedSuccess'),confirmButtonColor:'#047857'});showAssignmentList();await loadAssignments();}else Swal.fire({icon:'success',title:t('surveyDraftSaved'),timer:1300,showConfirmButton:false});}catch(error){showLoader(false);if(error.questionIds?.length)error.questionIds.forEach(id=>document.querySelector(`[data-question-id="${CSS.escape(id)}"]`)?.classList.add('border-red-400'));Swal.fire(t('error'),error.message||t('surveyResponseSaveError'),'error');}}
async function confirmSubmitResponse(){const confirmation=await Swal.fire({icon:'question',title:t('surveySubmitTitle'),text:t('surveySubmitConfirm'),showCancelButton:true,confirmButtonText:t('surveySubmit'),cancelButtonText:t('cancel'),confirmButtonColor:'#047857'});if(confirmation.isConfirmed)saveCurrentResponse(true);}
document.addEventListener('rdf:languagechange',()=>{if(CURRENT_SURVEY){const answers=Object.fromEntries(collectAnswers().map(item=>[item.questionId,item.value]));CURRENT_SURVEY.response={...(CURRENT_SURVEY.response||{}),answers};renderResponse();}else renderAssignments();});const surveyUser=requireAuth();if(surveyUser)renderNavUser(surveyUser);document.getElementById('appVersion').textContent=RDF.VERSION;lucide.createIcons();loadAssignments();
</script>
</body>
</html>
